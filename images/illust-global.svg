<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200">
  <title>지구본에서 해외 전시회 부스로 이어지는 항로를 표현한 일러스트</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="1.6" fill="#020617" fill-opacity=".08"/></pattern>
    <linearGradient id="fh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc" stop-opacity=".2"/><stop offset=".5" stop-color="#f8fafc" stop-opacity=".03"/><stop offset="1" stop-color="#f8fafc" stop-opacity=".12"/></linearGradient>
    <linearGradient id="fv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8fafc" stop-opacity=".2"/><stop offset=".5" stop-color="#f8fafc" stop-opacity=".03"/><stop offset="1" stop-color="#f8fafc" stop-opacity=".12"/></linearGradient>
    <pattern id="weave" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="26" height="26" fill="#020617"/>
      <rect x="1.5" y="1.5" width="10" height="10" rx="2.5" fill="url(#fh)"/>
      <rect x="14.5" y="1.5" width="10" height="10" rx="2.5" fill="url(#fv)"/>
      <rect x="1.5" y="14.5" width="10" height="10" rx="2.5" fill="url(#fv)"/>
      <rect x="14.5" y="14.5" width="10" height="10" rx="2.5" fill="url(#fh)"/>
    </pattern>
    <radialGradient id="shine" cx=".32" cy=".28" r=".75"><stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <clipPath id="globe"><circle cx="740" cy="600" r="270"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="44"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#dots)"/>
  <circle cx="760" cy="600" r="380" fill="#f59e0b" opacity=".22" filter="url(#blur)"/>

  <!-- 지구본 -->
  <ellipse cx="740" cy="905" rx="250" ry="34" fill="#020617" opacity=".2" filter="url(#shadow)"/>
  <g clip-path="url(#globe)">
    <rect x="460" y="320" width="560" height="560" fill="url(#weave)"/>
    <g fill="none" stroke="#f8fafc" stroke-opacity=".18" stroke-width="2">
      <ellipse cx="740" cy="600" rx="90" ry="270"/>
      <ellipse cx="740" cy="600" rx="180" ry="270"/>
      <line x1="740" y1="330" x2="740" y2="870"/>
      <line x1="470" y1="600" x2="1010" y2="600"/>
      <line x1="506" y1="465" x2="974" y2="465"/>
      <line x1="506" y1="735" x2="974" y2="735"/>
      <line x1="605" y1="366" x2="875" y2="366"/>
      <line x1="605" y1="834" x2="875" y2="834"/>
    </g>
    <circle cx="740" cy="600" r="270" fill="url(#shine)"/>
  </g>
  <circle cx="740" cy="600" r="270" fill="none" stroke="#f59e0b" stroke-opacity=".55" stroke-width="3"/>
  <ellipse cx="740" cy="600" rx="340" ry="96" fill="none" stroke="#f59e0b" stroke-opacity=".35" stroke-width="2" transform="rotate(-18 740 600)"/>

  <!-- 출발점 -->
  <circle cx="850" cy="500" r="40" fill="#f59e0b" opacity=".2"/>
  <circle cx="850" cy="500" r="24" fill="#f59e0b" opacity=".35"/>
  <circle cx="850" cy="500" r="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="4"/>

  <!-- 항로 -->
  <g fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12">
    <path d="M850,500 Q1080,230 1250,330"/>
    <path d="M850,500 Q600,200 410,300"/>
    <path d="M850,500 Q1100,560 1130,690"/>
  </g>
  <!-- 비행기 -->
  <g transform="translate(1060,300) rotate(18)" fill="#020617"><path d="M-22,0 L22,-4 L30,0 L22,4Z"/><path d="M2,-3 L-6,-20 L2,-20 L12,-3Z"/><path d="M2,3 L-6,20 L2,20 L12,3Z"/><path d="M-18,-1 L-24,-10 L-20,-10 L-12,-1Z"/></g>
  <g transform="translate(600,286) rotate(-160)" fill="#020617"><path d="M-22,0 L22,-4 L30,0 L22,4Z"/><path d="M2,-3 L-6,-20 L2,-20 L12,-3Z"/><path d="M2,3 L-6,20 L2,20 L12,3Z"/><path d="M-18,-1 L-24,-10 L-20,-10 L-12,-1Z"/></g>

  <!-- 도착 핀 -->
  <g>
    <path d="M1250,330 c-22,-26 -34,-40 -34,-58 a34,34 0 1 1 68,0 c0,18 -12,32 -34,58z" fill="#f59e0b"/>
    <circle cx="1250" cy="272" r="12" fill="#020617"/>
    <path d="M410,300 c-22,-26 -34,-40 -34,-58 a34,34 0 1 1 68,0 c0,18 -12,32 -34,58z" fill="#020617"/>
    <circle cx="410" cy="242" r="12" fill="#f59e0b"/>
  </g>

  <!-- 해외 전시회 부스 -->
  <g>
    <rect x="980" y="900" width="300" height="24" rx="8" fill="#020617" opacity=".2" filter="url(#shadow)"/>
    <rect x="1000" y="700" width="260" height="190" rx="10" fill="#ffffff" stroke="#020617" stroke-opacity=".12" stroke-width="2"/>
    <rect x="1000" y="700" width="10" height="200" fill="#020617"/>
    <rect x="1250" y="700" width="10" height="200" fill="#020617"/>
    <rect x="990" y="652" width="280" height="56" rx="10" fill="#f59e0b"/>
    <polygon points="1036,680 1027,695.6 1009,695.6 1000,680 1009,664.4 1027,664.4" fill="#020617" transform="translate(16 0)"/>
    <rect x="1062" y="670" width="150" height="12" rx="6" fill="#020617" fill-opacity=".85"/>
    <rect x="1062" y="689" width="96" height="9" rx="4.5" fill="#020617" fill-opacity=".45"/>
    <!-- 전시물 -->
    <rect x="1030" y="730" width="90" height="64" rx="8" fill="#020617"/>
    <rect x="1030" y="730" width="90" height="64" rx="8" fill="url(#weave)" opacity=".9"/>
    <rect x="1140" y="730" width="90" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
    <path d="M1165,775 l14,-18 12,12 14,-20" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 상담 테이블 -->
    <rect x="1060" y="820" width="140" height="80" rx="8" fill="#020617"/>
    <rect x="1060" y="836" width="140" height="8" fill="#f59e0b"/>
    <rect x="970" y="896" width="320" height="20" rx="6" fill="#020617"/>
  </g>

  <!-- 반짝임 -->
  <g fill="#f59e0b">
    <path d="M1360,560 l7,22 22,7 -22,7 -7,22 -7,-22 -22,-7 22,-7z"/>
    <path d="M380,720 l5,16 16,5 -16,5 -5,16 -5,-16 -16,-5 16,-5z" opacity=".7"/>
  </g>
</svg>
