<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <title>네 가지 전문분야가 탄소 결정을 중심으로 이어진 모습을 표현한 일러스트</title>
  <defs>
    <linearGradient id="fh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc" stop-opacity=".2"/><stop offset=".5" stop-color="#f8fafc" stop-opacity=".03"/><stop offset="1" stop-color="#f8fafc" stop-opacity=".12"/></linearGradient>
    <linearGradient id="fv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8fafc" stop-opacity=".2"/><stop offset=".5" stop-color="#f8fafc" stop-opacity=".03"/><stop offset="1" stop-color="#f8fafc" stop-opacity=".12"/></linearGradient>
    <pattern id="weave" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="28" height="28" fill="#020617"/>
      <rect x="1.5" y="1.5" width="11" height="11" rx="2.5" fill="url(#fh)"/>
      <rect x="15.5" y="1.5" width="11" height="11" rx="2.5" fill="url(#fv)"/>
      <rect x="1.5" y="15.5" width="11" height="11" rx="2.5" fill="url(#fv)"/>
      <rect x="15.5" y="15.5" width="11" height="11" rx="2.5" fill="url(#fh)"/>
    </pattern>
    <radialGradient id="vig" cx="400" cy="500" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#020617" stop-opacity="0"/><stop offset="1" stop-color="#020617" stop-opacity=".92"/></radialGradient>
    <radialGradient id="glow" cx="400" cy="520" r="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f59e0b" stop-opacity=".4"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="800" height="1000" fill="#020617"/>
  <rect width="800" height="1000" fill="url(#weave)" opacity=".7"/>
  <rect width="800" height="1000" fill="url(#vig)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- 동심 육각형 -->
  <g fill="none" stroke="#f59e0b">
    <polygon points="400,180 677,340 677,660 400,820 123,660 123,340" stroke-opacity=".16" stroke-width="2"/>
    <polygon points="400,280 590.5,390 590.5,610 400,720 209.5,610 209.5,390" stroke-opacity=".3" stroke-width="2" stroke-dasharray="4 10"/>
  </g>

  <!-- 연결선 -->
  <g stroke="#f59e0b" stroke-opacity=".45" stroke-width="2">
    <line x1="400" y1="300" x2="400" y2="390"/>
    <line x1="400" y1="640" x2="400" y2="712"/>
    <line x1="226" y1="500" x2="306" y2="500"/>
    <line x1="494" y1="500" x2="574" y2="500"/>
  </g>

  <!-- 중심 탄소 결정 -->
  <ellipse cx="400" cy="650" rx="140" ry="36" fill="#f59e0b" opacity=".55" filter="url(#blur)"/>
  <polygon points="355,482.9 310,440 310,560 355,602.9" fill="#ffffff"/>
  <polygon points="445,482.9 355,482.9 355,602.9 445,602.9" fill="#f59e0b"/>
  <polygon points="490,440 445,482.9 445,602.9 490,560" fill="#f59e0b"/>
  <polygon points="490,440 445,482.9 445,602.9 490,560" fill="#ffffff" opacity=".35"/>
  <polygon points="490,440 445,482.9 355,482.9 310,440 355,397.1 445,397.1" fill="#fffbeb"/>
  <polygon points="445,440 422.5,461.5 377.5,461.5 355,440 377.5,418.5 422.5,418.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <g stroke="#020617" stroke-opacity=".18" stroke-width="2"><line x1="355" y1="482.9" x2="355" y2="602.9"/><line x1="445" y1="482.9" x2="445" y2="602.9"/></g>
  <circle cx="400" cy="440" r="14" fill="#ffffff" filter="url(#soft)"/>

  <!-- 네 가지 전문분야 -->
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#f8fafc" fill-opacity=".88">
    <g transform="translate(400,250)">
      <circle r="50" fill="#020617" stroke="#f59e0b" stroke-width="2.5"/>
      <g transform="translate(-24,-24) scale(2)" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.6 18.6A1.6 1.6 0 0 0 6 21h12a1.6 1.6 0 0 0 1.4-2.4L14 9V3"/><path d="M7.5 15h9"/></g>
      <text y="-70">기술·연구개발</text>
    </g>
    <g transform="translate(624,500)">
      <circle r="50" fill="#020617" stroke="#f59e0b" stroke-width="2.5"/>
      <g transform="translate(-24,-24) scale(2)" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></g>
      <text y="86">지식재산권</text>
    </g>
    <g transform="translate(400,762)">
      <circle r="50" fill="#020617" stroke="#f59e0b" stroke-width="2.5"/>
      <g transform="translate(-24,-24) scale(2)" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0-5.3 5.3L4 17l3 3 5.2-5.2a4 4 0 0 0 5.3-5.3l-2.4 2.4-2.6-.6-.6-2.6z"/></g>
      <text y="86">기술지원</text>
    </g>
    <g transform="translate(176,500)">
      <circle r="50" fill="#020617" stroke="#f59e0b" stroke-width="2.5"/>
      <g transform="translate(-24,-24) scale(2)" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></g>
      <text y="86">국제협력</text>
    </g>
  </g>

  <!-- 입자 -->
  <g fill="#f59e0b">
    <circle cx="560" cy="300" r="4" opacity=".7"/><circle cx="250" cy="680" r="3" opacity=".6"/><circle cx="600" cy="720" r="3" opacity=".5"/><circle cx="220" cy="320" r="3" opacity=".5"/>
  </g>
</svg>
