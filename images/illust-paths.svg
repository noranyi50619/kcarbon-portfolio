<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200">
  <title>흩어진 여러 갈래의 선이 한 점으로 모여 하나의 길이 되는 일러스트</title>
  <defs>
    <linearGradient id="fh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc" stop-opacity=".2"/><stop offset=".5" stop-color="#f8fafc" stop-opacity=".03"/><stop offset="1" stop-color="#f8fafc" stop-opacity=".12"/></linearGradient>
    <linearGradient id="fv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8fafc" stop-opacity=".2"/><stop offset=".5" stop-color="#f8fafc" stop-opacity=".03"/><stop offset="1" stop-color="#f8fafc" stop-opacity=".12"/></linearGradient>
    <pattern id="weave" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="40" height="40" fill="#020617"/>
      <rect x="2" y="2" width="16" height="16" rx="4" fill="url(#fh)"/>
      <rect x="22" y="2" width="16" height="16" rx="4" fill="url(#fv)"/>
      <rect x="2" y="22" width="16" height="16" rx="4" fill="url(#fv)"/>
      <rect x="22" y="22" width="16" height="16" rx="4" fill="url(#fh)"/>
    </pattern>
    <radialGradient id="glow" cx="1180" cy="560" r="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f59e0b" stop-opacity=".45"/><stop offset=".4" stop-color="#f59e0b" stop-opacity=".1"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <linearGradient id="out" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1800" height="1200" fill="#020617"/>
  <rect width="1800" height="1200" fill="url(#weave)" opacity=".35"/>
  <rect width="1800" height="1200" fill="url(#glow)"/>

  <g fill="none" stroke-linecap="round">
    <g stroke="#f8fafc" stroke-opacity=".22" stroke-width="2">
      <path d="M-20,60 C500,60 800,310 1180,560"/>
      <path d="M-20,230 C500,230 800,395 1180,560"/>
      <path d="M-20,430 C500,430 800,495 1180,560"/>
      <path d="M-20,700 C500,700 800,630 1180,560"/>
      <path d="M-20,800 C500,800 800,680 1180,560"/>
      <path d="M-20,1030 C500,1030 800,795 1180,560"/>
      <path d="M-20,1160 C500,1160 800,860 1180,560"/>
      <path d="M260,-20 C420,240 800,360 1180,560"/>
      <path d="M300,1220 C480,960 800,760 1180,560"/>
    </g>
    <g stroke="#f59e0b" stroke-width="3.5">
      <path d="M-20,120 C500,120 800,340 1180,560" stroke-opacity=".85"/>
      <path d="M-20,610 C500,610 800,585 1180,560" stroke-opacity=".85"/>
      <path d="M-20,910 C500,910 800,735 1180,560" stroke-opacity=".85"/>
    </g>
    <path d="M1180,560 C1400,560 1560,530 1830,480" stroke="#f59e0b" stroke-width="40" stroke-opacity=".4" filter="url(#soft)"/>
    <path d="M1180,560 C1400,560 1560,530 1830,480" stroke="url(#out)" stroke-width="10"/>
  </g>

  <!-- 선 위의 마디 -->
  <g fill="#f59e0b">
    <circle cx="632" cy="257" r="7"/><circle cx="632" cy="594" r="7"/><circle cx="632" cy="801" r="7"/>
  </g>
  <g fill="#f8fafc" fill-opacity=".6">
    <circle cx="632" cy="409" r="4"/><circle cx="632" cy="883" r="4"/><circle cx="632" cy="740" r="4"/><circle cx="632" cy="330" r="4"/>
  </g>

  <!-- 하나의 창구 -->
  <circle cx="1180" cy="560" r="90" fill="#f59e0b" opacity=".55" filter="url(#blur)"/>
  <polygon points="1240,560 1210,612 1150,612 1120,560 1150,508 1210,508" fill="#020617" stroke="#f59e0b" stroke-width="4"/>
  <polygon points="1210,560 1195,586 1165,586 1150,560 1165,534 1195,534" fill="#fffbeb"/>
  <circle cx="1180" cy="560" r="150" fill="none" stroke="#f59e0b" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="1180" cy="560" r="220" fill="none" stroke="#f59e0b" stroke-opacity=".12" stroke-width="2" stroke-dasharray="3 12"/>
</svg>
