<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200">
  <title>특허 문서와 인증 도장, 기술을 지키는 방패를 표현한 일러스트</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#fffbeb"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="1.6" fill="#020617" fill-opacity=".1"/></pattern>
    <linearGradient id="fh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc" stop-opacity=".2"/><stop offset=".5" stop-color="#f8fafc" stop-opacity=".03"/><stop offset="1" stop-color="#f8fafc" stop-opacity=".12"/></linearGradient>
    <linearGradient id="fv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8fafc" stop-opacity=".2"/><stop offset=".5" stop-color="#f8fafc" stop-opacity=".03"/><stop offset="1" stop-color="#f8fafc" stop-opacity=".12"/></linearGradient>
    <pattern id="weave" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="28" height="28" fill="#020617"/>
      <rect x="1.5" y="1.5" width="11" height="11" rx="2.5" fill="url(#fh)"/>
      <rect x="15.5" y="1.5" width="11" height="11" rx="2.5" fill="url(#fv)"/>
      <rect x="1.5" y="15.5" width="11" height="11" rx="2.5" fill="url(#fv)"/>
      <rect x="15.5" y="15.5" width="11" height="11" rx="2.5" fill="url(#fh)"/>
    </pattern>
    <radialGradient id="seal" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fffbeb"/><stop offset=".45" stop-color="#f59e0b"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="44"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="shieldClip"><path d="M1010,250 L1230,330 L1230,560 C1230,720 1130,830 1010,880 C890,830 790,720 790,560 L790,330 Z"/></clipPath>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#dots)"/>
  <circle cx="820" cy="600" r="360" fill="#f59e0b" opacity=".22" filter="url(#blur)"/>

  <!-- 방패 -->
  <path d="M1030,280 L1250,360 L1250,590 C1250,750 1150,860 1030,910 C910,860 810,750 810,590 L810,360 Z" fill="#020617" opacity=".16" filter="url(#shadow)"/>
  <g clip-path="url(#shieldClip)">
    <rect x="780" y="240" width="460" height="650" fill="url(#weave)"/>
    <rect x="780" y="240" width="460" height="650" fill="#020617" opacity=".2"/>
  </g>
  <path d="M1010,292 L1194,359 L1194,560 C1194,700 1108,796 1010,838 C912,796 826,700 826,560 L826,359 Z" fill="none" stroke="#f59e0b" stroke-opacity=".7" stroke-width="3"/>
  <polygon points="1080,520 1045,580.6 975,580.6 940,520 975,459.4 1045,459.4" fill="#f59e0b"/>
  <polygon points="1080,520 1045,580.6 975,580.6 940,520 975,459.4 1045,459.4" fill="none" stroke="#fffbeb" stroke-width="3" stroke-opacity=".7" transform="translate(1010 520) scale(.78) translate(-1010 -520)"/>
  <circle cx="1010" cy="507" r="15" fill="#020617"/>
  <path d="M1002,515 h16 l6,38 h-28z" fill="#020617"/>

  <!-- 특허 문서 -->
  <g transform="rotate(-5 700 600)">
    <rect x="486" y="322" width="440" height="600" rx="26" fill="#020617" opacity=".18" filter="url(#shadow)"/>
    <rect x="470" y="300" width="440" height="600" rx="26" fill="#ffffff"/>
    <rect x="470" y="300" width="440" height="600" rx="26" fill="none" stroke="#020617" stroke-opacity=".08" stroke-width="2"/>
    <path d="M496,300 h388 a26,26 0 0 1 26,26 v84 h-440 v-84 a26,26 0 0 1 26,-26z" fill="#020617"/>
    <polygon points="538,355 528,372.3 508,372.3 498,355 508,337.7 528,337.7" fill="#f59e0b"/>
    <rect x="560" y="338" width="190" height="13" rx="6.5" fill="#f8fafc" fill-opacity=".9"/>
    <rect x="560" y="361" width="120" height="10" rx="5" fill="#f8fafc" fill-opacity=".4"/>
    <rect x="510" y="452" width="270" height="18" rx="9" fill="#020617" fill-opacity=".85"/>
    <g fill="#020617" fill-opacity=".12">
      <rect x="510" y="496" width="360" height="12" rx="6"/>
      <rect x="510" y="526" width="330" height="12" rx="6"/>
      <rect x="510" y="556" width="350" height="12" rx="6"/>
      <rect x="510" y="586" width="250" height="12" rx="6"/>
    </g>
    <rect x="510" y="620" width="160" height="12" rx="6" fill="#f59e0b"/>
    <!-- 도면 스케치 -->
    <g fill="none" stroke="#020617" stroke-opacity=".35" stroke-width="2.5">
      <polygon points="610,690 660,719 660,777 610,806 560,777 560,719"/>
      <line x1="660" y1="748" x2="760" y2="748" stroke-dasharray="4 7"/>
      <circle cx="790" cy="748" r="28"/>
      <line x1="790" y1="720" x2="790" y2="680" stroke-dasharray="4 7"/>
    </g>
    <circle cx="610" cy="748" r="8" fill="#f59e0b"/>
  </g>

  <!-- 인증 도장 -->
  <g>
    <polygon points="808,880 790,1010 830,985 856,1024 868,900" fill="#f59e0b"/>
    <polygon points="808,880 790,1010 830,985 856,1024 868,900" fill="#020617" opacity=".15"/>
    <polygon points="892,880 910,1010 870,985 844,1024 832,900" fill="#f59e0b"/>
    <circle cx="850" cy="840" r="96" fill="#020617" opacity=".16" filter="url(#shadow)"/>
    <circle cx="850" cy="830" r="92" fill="url(#seal)"/>
    <circle cx="850" cy="830" r="72" fill="none" stroke="#020617" stroke-opacity=".35" stroke-width="2.5" stroke-dasharray="3 7"/>
    <polygon points="884,830 867,859.4 833,859.4 816,830 833,800.6 867,800.6" fill="#020617"/>
    <path d="m834,831 11,11 22,-24" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 아이디어 전구 -->
  <circle cx="400" cy="330" r="110" fill="#f59e0b" opacity=".45" filter="url(#blur)"/>
  <g stroke="#f59e0b" stroke-width="6" stroke-linecap="round">
    <line x1="400" y1="208" x2="400" y2="180"/><line x1="314" y1="246" x2="294" y2="226"/><line x1="486" y1="246" x2="506" y2="226"/><line x1="282" y1="330" x2="254" y2="330"/><line x1="518" y1="330" x2="546" y2="330"/>
  </g>
  <path d="M400,262 a68,68 0 0 1 40,123 c-8,6 -12,14 -12,24 h-56 c0,-10 -4,-18 -12,-24 a68,68 0 0 1 40,-123z" fill="#fffbeb" stroke="#020617" stroke-width="7" stroke-linejoin="round"/>
  <path d="M380,350 l10,-16 10,16 10,-16 10,16" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="370" y="418" width="60" height="14" rx="7" fill="#020617"/>
  <rect x="378" y="440" width="44" height="14" rx="7" fill="#020617"/>

  <!-- 떠다니는 육각형 -->
  <g fill="#f59e0b">
    <polygon points="1330,300 1316,324 1288,324 1274,300 1288,276 1316,276" opacity=".5"/>
    <polygon points="1300,980 1293,992 1279,992 1272,980 1279,968 1293,968" opacity=".7"/>
    <polygon points="360,860 349,879 327,879 316,860 327,841 349,841" fill="none" stroke="#f59e0b" stroke-width="3"/>
  </g>
</svg>
